name: Candidate Intel Mac installer acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify the exact release candidate and run the installed checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45414536968 --name meetingpal-macos-x64 --dir candidate
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          root = pathlib.Path("candidate")
          manifest = json.loads((root / "build-info.json").read_text())
          assert manifest["revision"] == "cdcc47167f58a375a8cf01dacf5d8df6c6b5d3a3" and manifest["version"] == "0.1.3"
          item, = [entry for entry in manifest["files"] if entry["path"].endswith(".dmg")]
          exe = root / item["path"]
          assert hashlib.file_digest(exe.open("rb"),"sha256").hexdigest() == item["sha256"]
          subprocess.run([sys.executable,"scripts/check-installed.py",str(exe),"acceptance.json","0.1.3","--test-ai"],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: installed-intel-mac
          path: acceptance.json
