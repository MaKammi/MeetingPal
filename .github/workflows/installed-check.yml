name: Installed model picker acceptance
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install exact Ubuntu release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45427418295 --name meetingpal-linux-x64 --dir candidate
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("candidate")
          manifest = json.loads((root / "build-info.json").read_text())
          assert manifest["revision"] == "d27a75687c3173303e3c9ebe2d289d52dca3c178"
          item, = [part for part in manifest["files"] if part["path"].endswith(".deb")]
          deb = root / item["path"]
          assert hashlib.file_digest(deb.open("rb"),"sha256").hexdigest() == item["sha256"]
          subprocess.run(["sudo","apt-get","update","-qq"],check=True)
          subprocess.run(["sudo","apt-get","install","-y",str(deb.resolve()),"python3-pyatspi","openbox","xvfb","xauth","dbus-x11","xdotool"],check=True)
          PY
      - name: Operate native WebKit provider controls without credentials
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/check-installed-model-picker.py
