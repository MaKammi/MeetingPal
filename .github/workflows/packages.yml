name: Desktop packages and releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-codecs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify release tag matches application version
        if: github.ref_type == 'tag'
        run: node scripts/release.mjs check-tag
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: codecs
        with:
          path: src-tauri/binaries/
          key: windows-source-codecs-${{ hashFiles('scripts/build-codecs.mjs', 'resources/runtimes.json') }}
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm cmake pkg-config
        if: steps.codecs.outputs.cache-hit != 'true'
      - run: node scripts/build-codecs.mjs --target=win32
        if: steps.codecs.outputs.cache-hit != 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-source-codecs
          path: src-tauri/binaries/
          retention-days: 1
  package:
    needs: windows-codecs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: macos-15
            name: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            name: macos-x64
            bundles: app,dmg
          - os: ubuntu-24.04
            name: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev libxcb-randr0-dev libwayland-dev libgbm-dev libegl1-mesa-dev libclang-dev libxdo-dev libsecret-1-dev clang cmake nasm pkg-config
      - name: macOS codec tools
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtimes
        with:
          path: src-tauri/binaries/
          key: bundled-runtimes-${{ matrix.name }}-${{ hashFiles('scripts/build-runtimes.mjs', 'scripts/build-codecs.mjs', 'resources/runtimes.json') }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: runner.os == 'Windows'
        with:
          name: windows-source-codecs
          path: src-tauri/binaries/
      - run: node scripts/build-runtimes.mjs --only=whisper,llama
        if: runner.os == 'Windows' && steps.runtimes.outputs.cache-hit != 'true'
      - run: npm run runtimes:build
        if: runner.os != 'Windows' && steps.runtimes.outputs.cache-hit != 'true'
      - name: Free temporary runtime and debug build space
        run: node scripts/clean-package-runner.mjs before-build
      - name: Native tests and media pipeline with bundled codecs
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib --test pipeline -- --include-ignored
      - run: npm test
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Archive macOS application for the updater
        if: runner.os == 'macOS'
        working-directory: src-tauri/target/release/bundle/macos
        run: COPYFILE_DISABLE=1 tar -czf "MeetingPal.app.tar.gz" MeetingPal.app
      - name: Collect bundled Linux library notices and source references
        if: runner.os == 'Linux'
        run: python3 scripts/appimage-notices.py
      - name: Record installer checksums and source revision
        run: node scripts/package-manifest.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meetingpal-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/appimage-notices.tar.gz
            src-tauri/target/release/bundle/build-info.json
          if-no-files-found: error
          retention-days: 2
      - name: Free uploaded package staging before saving caches
        run: node scripts/clean-package-runner.mjs after-upload
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'MaKammi/MeetingPal'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: meetingpal-*
          path: runtime-data/release-input
      - name: Sign versioned updates and verify every package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release.mjs prepare
      - name: Publish verified assets and update feed together
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
